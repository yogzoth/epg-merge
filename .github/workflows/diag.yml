name: Guide source check
on: workflow_dispatch
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - env:
          T: ${{ secrets.PROVIDER_EPG_URL }}
        run: |
          {
          date -u
          for ua in "Mozilla/5.0" "Mozilla/5.0 (epg-merge)" "TiviMate/5.1.6 (Android 12)"; do
            echo "curl UA=$ua -> $(curl -s -o /dev/null -w '%{http_code} %{size_download}' -A "$ua" "$T")"
          done
          python3 - <<'PY'
          import os, urllib.request
          for ua in ("Mozilla/5.0", "Mozilla/5.0 (epg-merge)", None):
              h = {"User-Agent": ua} if ua else {}
              try:
                  with urllib.request.urlopen(urllib.request.Request(os.environ["T"], headers=h), timeout=120) as r:
                      print("python UA", ua, r.status, len(r.read()))
              except Exception as e:
                  print("python UA", ua, "ERR", e)
          PY
          curl -s "https://epgshare01.online/epgshare01/epg_ripper_US2.xml.gz" | gunzip > us2.xml
          python3 - <<'PY'
          import re
          x = open("us2.xml", encoding="utf-8", errors="replace").read()
          st = re.findall(r'<programme start="(\d{12})', x)
          print("us2 programmes", len(st), "first", min(st), "last", max(st))
          ion = re.findall(r'<programme start="(\d{12})[^>]*channel="ION.Television.HD.us2"', x)
          print("ION us2", len(ion), min(ion) if ion else "", max(ion) if ion else "")
          PY
          } > /tmp/diag.txt 2>&1
          mkdir /tmp/o && cp /tmp/diag.txt /tmp/o/ && cd /tmp/o && git init -q -b diag && git add . && git -c user.name=bot -c user.email=bot@x commit -qm diag && git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" diag
