name: Guide source check
on: workflow_dispatch
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          mkdir /tmp/o
          for cc in US CA GB AU PT; do
            curl -sL -o $cc.gz https://epg.pw/xmltv/epg_$cc.xml.gz
            python3 - $cc.gz /tmp/o/epgpw_$cc.tsv <<'PY'
          import gzip, re, sys, collections
          x = gzip.open(sys.argv[1]).read().decode("utf-8", "replace")
          names = {}
          for m in re.finditer(r'<channel id="([^"]+)">(.*?)</channel>', x, re.S):
              names[m.group(1)] = " | ".join(re.findall(r'<display-name[^>]*>([^<]*)', m.group(2)))
          cnt = collections.Counter(); end = {}
          for m in re.finditer(r'<programme\b([^>]*)>', x):
              a = m.group(1); c = re.search(r'channel="([^"]+)"', a).group(1); s = re.search(r'stop="(\d{12})', a)
              cnt[c] += 1
              if s and s.group(1) > end.get(c, ""): end[c] = s.group(1)
          with open(sys.argv[2], "w") as f:
              for k, v in names.items(): f.write(f"{k}\t{v}\t{cnt[k]}\t{end.get(k,'')}\n")
          PY
          done
          head -c 600 US.gz | gunzip 2>/dev/null | head -c 600 > /tmp/o/sample.txt
          cd /tmp/o && git init -q -b diag && git add . && git -c user.name=bot -c user.email=bot@x commit -qm diag && git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" diag
