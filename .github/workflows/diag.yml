name: Guide source check
on: workflow_dispatch
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          {
          date -u
          curl -s https://epgshare01.online/epgshare01/ | grep -oE 'epg_ripper_(US|CA)[^"<]*\.xml\.gz[^<]*<[^>]*>[^<]*' | sed -E 's/<[^>]*>/ /g' | head -40
          for u in https://epgshare01.online/epgshare01/epg_ripper_US2.xml.gz https://epgshare01.online/epgshare01/epg_ripper_US1.xml.gz https://epgshare01.online/epgshare01/epg_ripper_CA2.xml.gz https://epg.pw/xmltv/epg_US.xml.gz https://epg.pw/xmltv/epg_CA.xml.gz; do
            f=$(basename $u); echo "$f -> $(curl -sL -o $f -w '%{http_code} %{size_download}' $u)"
            python3 - "$f" <<'PY'
          import gzip, re, sys, collections
          try:
              x = gzip.open(sys.argv[1]).read().decode("utf-8", "replace")
          except Exception as e:
              print("  unreadable", e); sys.exit()
          ends = collections.defaultdict(str)
          for m in re.finditer(r'<programme\b([^>]*)>', x):
              a = m.group(1); c = re.search(r'channel="([^"]+)"', a); s = re.search(r'stop="(\d{12})', a)
              if c and s and s.group(1) > ends[c.group(1)]: ends[c.group(1)] = s.group(1)
          v = sorted(ends.values())
          print("  channels", len(ends), "programmes", x.count("<programme"), "median end", v[len(v)//2] if v else "", "max end", v[-1] if v else "")
          for k in [k for k in ends if re.search(r'(?i)^ion|tvland|tv\.land|buzzr|^tbs', k)][:8]: print("   ", k, ends[k])
          PY
          done
          } > /tmp/diag.txt 2>&1
          mkdir /tmp/o && cp /tmp/diag.txt /tmp/o/ && cd /tmp/o && git init -q -b diag && git add . && git -c user.name=bot -c user.email=bot@x commit -qm diag && git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" diag
